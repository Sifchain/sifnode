apiVersion: v1
kind: Service
metadata:
  name: {{ include "sifnode.name" . }}-headless
  labels:
    {{- include "sifnode.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "sifnode.labels" . | nindent 4 }}
  ports:
    - name: p2p
      port: 26656
      targetPort: p2p
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sifnode.name" . }}-p2p
  labels:
    {{- include "sifnode.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "sifnode.labels" . | nindent 4 }}
  ports:
    - name: p2p
      port: 26656
      targetPort: p2p
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sifnode.name" . }}-rpc
  labels:
    {{- include "sifnode.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sifnode.labels" . | nindent 4 }}
  ports:
    - name: rpc
      port: 26657
      targetPort: rpc
